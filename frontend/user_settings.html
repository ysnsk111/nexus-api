<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAPI — User Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#080e1a; --sidebar:#0c1628; --surface:rgba(15,24,42,0.8); --surface2:rgba(22,35,58,0.6); --border:rgba(148,163,184,0.1); --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; font-size:0.875rem; }
        .sidebar { width:240px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:1.25rem 0.75rem; position:sticky; top:0; height:100vh; overflow-y:auto; }
        .brand { padding:0.25rem 0.5rem 1.5rem; font-size:1.1rem; font-weight:700; letter-spacing:-0.02em; }
        .brand em { color:var(--accent); font-style:normal; }
        .nav-link { display:flex; align-items:center; gap:0.6rem; padding:0.6rem 0.75rem; color:var(--muted); text-decoration:none; border-radius:8px; font-weight:500; font-size:0.82rem; transition:all 0.15s; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
        .nav-link:hover { background:rgba(56,189,248,0.07); color:var(--text); }
        .nav-link.active { background:rgba(56,189,248,0.12); color:var(--accent); }
        .nav-link svg { width:16px; height:16px; flex-shrink:0; }
        .nav-bottom { margin-top:auto; }
        .lang-select { width:100%; padding:0.5rem 0.75rem; background:rgba(8,14,26,0.6); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:0.78rem; font-family:inherit; outline:none; margin-top:0.75rem; cursor:pointer; }
        .main { flex:1; display:flex; flex-direction:column; min-width:0; }
        .topbar { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:rgba(8,14,26,0.5); backdrop-filter:blur(8px); position:sticky; top:0; z-index:10; }
        .topbar-title { font-size:1rem; font-weight:600; }
        .content { padding:1.5rem; max-width:680px; }
        .section-title { font-size:0.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:1rem; }
        .card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1.25rem; }
        .form-group { margin-bottom:1rem; }
        .form-label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:0.4rem; font-weight:500; }
        input[type=text], input[type=email], input[type=password] { width:100%; padding:0.6rem 0.85rem; background:rgba(8,14,26,0.7); border:1px solid rgba(148,163,184,0.18); border-radius:8px; color:var(--text); font-size:0.82rem; font-family:inherit; outline:none; transition:border-color 0.2s; }
        input:focus { border-color:var(--accent); }
        .btn { padding:0.6rem 1.1rem; border:none; border-radius:8px; font-size:0.82rem; font-weight:500; font-family:inherit; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:0.4rem; }
        .btn-primary { background:linear-gradient(135deg,#0ea5e9,#2563eb); color:white; }
        .btn-primary:hover { box-shadow:0 4px 14px rgba(14,165,233,0.35); transform:translateY(-1px); }
        .btn-danger { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.2); }
        .btn-ghost { background:rgba(148,163,184,0.08); color:var(--muted); border:1px solid var(--border); }
        .btn-sm { padding:0.35rem 0.7rem; font-size:0.75rem; }
        .success-toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#0f2d1e; border:1px solid rgba(16,185,129,0.3); border-radius:10px; padding:0.75rem 1.1rem; color:#6ee7b7; font-size:0.82rem; opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:200; }
        .success-toast.show { opacity:1; }
        .qr-area { text-align:center; padding:1rem 0; }
        .qr-uri { font-family:monospace; font-size:0.72rem; color:var(--accent); word-break:break-all; background:rgba(8,14,26,0.6); padding:0.75rem; border-radius:8px; margin:0.75rem 0; }
        .divider { height:1px; background:var(--border); margin:1rem 0; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
    
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; z-index: 1000; transition: left 0.3s; height: 100vh; }
            .sidebar.open { left: 0; }
            .mobile-menu-btn { display: inline-flex !important; align-items: center; justify-content: center; width: 32px; height: 32px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; margin-right: 12px; }
            .topbar { padding: 1rem; }
            .content { padding: 1rem; }
            .form-row, .quota-grid { grid-template-columns: 1fr; }
            .brand { padding-top: 0.5rem; }
        }
        .mobile-menu-btn { display: none; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); z-index: 999; opacity: 0; transition: opacity 0.3s; }
        .mobile-overlay.open { display: block; opacity: 1; }

    </style>
</head>
<body>

<nav class="sidebar">
    <div class="brand">Nexus<em>API</em></div>
    <button class="nav-link" onclick="window.location.href = BASE_PATH + '/dashboard'">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span id="t_dashboard">Dashboard</span>
    </button>
    <button class="nav-link active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span id="t_settings">Settings</span>
    </button>
    <div class="nav-bottom">
        <button class="nav-link" style="color:#fca5a5" onclick="logout()">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span id="t_logout">Logout</span>
        </button>
        <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ru">Русский</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
        </select>
    </div>
</nav>

<div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
<div class="main">
    <div class="topbar">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">≡</button>
        <div class="topbar-title" id="pageTitle">Account Settings</div>
    </div>
    <div class="content">
        <!-- Account Security -->
        <div class="card">
            <div class="section-title" id="sc_security">Account Security</div>
            <div class="form-group">
                <label class="form-label" id="lb_new_user">New Username</label>
                <input type="text" id="new_username" autocomplete="off">
            </div>
            <button class="btn btn-ghost btn-sm" onclick="updateUsername()" id="btn_upd_user">Update Username</button>
            <div class="divider"></div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" id="lb_old_pass">Current Password</label>
                    <input type="password" id="old_password">
                </div>
                <div class="form-group">
                    <label class="form-label" id="lb_new_pass">New Password</label>
                    <input type="password" id="new_password">
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="updatePassword()" id="btn_upd_pass">Update Password</button>
            <div class="divider"></div>
            <div id="totpSection">
                <div id="totp_setup_area">
                    <button class="btn btn-ghost btn-sm" onclick="setupTOTP()" id="btn_totp_setup">Enable 2FA (TOTP)</button>
                </div>
                <div id="totp_qr_area" style="display:none">
                    <div class="qr-area">
                        <p style="color:var(--muted);font-size:0.82rem;margin-bottom:0.5rem" id="totp_hint">Scan this URI with your authenticator app:</p>
                        <div class="qr-uri" id="totp_uri"></div>
                        <div style="display:flex;gap:0.5rem;justify-content:center;margin-top:0.75rem">
                            <input type="text" id="totp_verify_code" placeholder="Enter 6-digit code" style="width:180px;text-align:center;letter-spacing:0.15em">
                            <button class="btn btn-primary btn-sm" onclick="verifyTOTP()" id="btn_verify_totp">Verify & Enable</button>
                        </div>
                    </div>
                </div>
                <div id="totp_enabled_area" style="display:none">
                    <p style="color:var(--success);font-size:0.82rem;margin-bottom:0.75rem" id="totp_enabled_msg">✓ 2FA is enabled</p>
                    <div style="display:flex;gap:0.5rem;align-items:center">
                        <input type="password" id="totp_disable_pass" placeholder="Current password to disable 2FA" style="flex:1">
                        <button class="btn btn-danger btn-sm" onclick="disableTOTP()" id="btn_disable_totp">Disable 2FA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="success-toast" id="toast"></div>

<script>
const BASE_PATH = window.location.pathname.replace(/\/(admin(\/settings)?|dashboard|user(\/settings)?)\/?$/, '').replace(/\/$/, '') || '';
const token = localStorage.getItem('token');
if (!token) window.location.href = BASE_PATH + '/';
let LANG = localStorage.getItem('lang') || 'en';

const I18N = {
    en: { pageTitle:'Account Settings', t_dashboard:'Dashboard', t_settings:'Settings', t_logout:'Logout', sc_security:'Account Security', lb_new_user:'New Username', btn_upd_user:'Update Username', lb_old_pass:'Current Password', lb_new_pass:'New Password', btn_upd_pass:'Update Password', btn_totp_setup:'Enable 2FA (TOTP)', totp_hint:'Scan this URI with your authenticator app:', btn_verify_totp:'Verify & Enable', totp_enabled_msg:'✓ 2FA is enabled', btn_disable_totp:'Disable 2FA' },
    zh: { pageTitle:'账户设置', t_dashboard:'控制台', t_settings:'设置', t_logout:'退出', sc_security:'账户安全', lb_new_user:'新用户名', btn_upd_user:'更新用户名', lb_old_pass:'当前密码', lb_new_pass:'新密码', btn_upd_pass:'更新密码', btn_totp_setup:'启用两步验证', totp_hint:'用验证器扫描此 URI：', btn_verify_totp:'验证并启用', totp_enabled_msg:'✓ 两步验证已启用', btn_disable_totp:'禁用两步验证' },
    ja: { pageTitle:'アカウント設定', t_dashboard:'ダッシュボード', t_settings:'設定', t_logout:'ログアウト', sc_security:'アカウントセキュリティ', lb_new_user:'新しいユーザー名', btn_upd_user:'ユーザー名更新', lb_old_pass:'現在のパスワード', lb_new_pass:'新しいパスワード', btn_upd_pass:'パスワード更新', btn_totp_setup:'2FA有効化', totp_hint:'認証アプリでこのURIをスキャン：', btn_verify_totp:'確認して有効化', totp_enabled_msg:'✓ 2FAが有効', btn_disable_totp:'2FA無効化' },
    ru: { pageTitle:'Настройки аккаунта', t_dashboard:'Обзор', t_settings:'Настройки', t_logout:'Выйти', sc_security:'Безопасность аккаунта', lb_new_user:'Новый логин', btn_upd_user:'Обновить логин', lb_old_pass:'Текущий пароль', lb_new_pass:'Новый пароль', btn_upd_pass:'Обновить пароль', btn_totp_setup:'Включить 2FA', totp_hint:'Отсканируйте URI в приложении:', btn_verify_totp:'Подтвердить', totp_enabled_msg:'✓ 2FA включена', btn_disable_totp:'Отключить 2FA' },
    ko: { pageTitle:'계정 설정', t_dashboard:'대시보드', t_settings:'설정', t_logout:'로그아웃', sc_security:'계정 보안', lb_new_user:'새 사용자명', btn_upd_user:'사용자명 변경', lb_old_pass:'현재 비밀번호', lb_new_pass:'새 비밀번호', btn_upd_pass:'비밀번호 변경', btn_totp_setup:'2FA 활성화', totp_hint:'인증 앱으로 이 URI 스캔:', btn_verify_totp:'확인 및 활성화', totp_enabled_msg:'✓ 2FA 활성화됨', btn_disable_totp:'2FA 비활성화' },
    fr: { pageTitle:'Paramètres du compte', t_dashboard:'Tableau de bord', t_settings:'Paramètres', t_logout:'Déconnexion', sc_security:'Sécurité du compte', lb_new_user:"Nouveau nom d'utilisateur", btn_upd_user:"Changer le nom", lb_old_pass:'Mot de passe actuel', lb_new_pass:'Nouveau mot de passe', btn_upd_pass:'Changer le mot de passe', btn_totp_setup:'Activer la 2FA', totp_hint:"Scannez l'URI avec votre appli:", btn_verify_totp:'Vérifier et activer', totp_enabled_msg:'✓ 2FA activée', btn_disable_totp:'Désactiver la 2FA' },
    es: { pageTitle:'Configuración de la cuenta', t_dashboard:'Panel', t_settings:'Configuración', t_logout:'Cerrar sesión', sc_security:'Seguridad de la cuenta', lb_new_user:'Nuevo nombre de usuario', btn_upd_user:'Actualizar nombre', lb_old_pass:'Contraseña actual', lb_new_pass:'Nueva contraseña', btn_upd_pass:'Actualizar contraseña', btn_totp_setup:'Activar 2FA', totp_hint:'Escanea este URI con tu app:', btn_verify_totp:'Verificar y activar', totp_enabled_msg:'✓ 2FA activada', btn_disable_totp:'Desactivar 2FA' }
};
function t(k) { return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k; }
function setLang(l) { LANG=l; localStorage.setItem('lang',l); applyLang(); }
function applyLang() {
    Object.keys(I18N.en).forEach(k => { const el=document.getElementById(k); if(el) el.textContent=t(k); });
    document.getElementById('langSelect').value = LANG;
}

async function api(path, opts={}) {
    const res = await fetch(BASE_PATH + '/api'+path, { ...opts, headers: {'Content-Type':'application/json','Authorization':'Bearer '+token, ...(opts.headers||{})} });
    if (res.status === 401) { logout(); return null; }
    return res;
}

function showToast(msg, ok=true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.borderColor = ok ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)';
    el.style.color = ok ? '#6ee7b7' : '#fca5a5';
    el.style.background = ok ? '#0f2d1e' : '#2d0f0f';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
}

async function updateUsername() {
    const username = document.getElementById('new_username').value.trim();
    if (!username) return;
    const res = await api('/user/username', { method:'PUT', body:JSON.stringify({username}) });
    showToast(res&&res.ok ? 'Username updated' : 'Update failed', res&&res.ok);
}

async function updatePassword() {
    const old_password = document.getElementById('old_password').value;
    const new_password = document.getElementById('new_password').value;
    if (!old_password||!new_password) return;
    const res = await api('/user/password', { method:'PUT', body:JSON.stringify({old_password,new_password}) });
    showToast(res&&res.ok ? 'Password updated' : 'Update failed', res&&res.ok);
    if (res&&res.ok) { document.getElementById('old_password').value=''; document.getElementById('new_password').value=''; }
}

async function setupTOTP() {
    const res = await api('/user/totp/setup', { method:'POST' });
    if (!res||!res.ok) return;
    const d = await res.json();
    document.getElementById('totp_uri').textContent = d.uri;
    document.getElementById('totp_setup_area').style.display = 'none';
    document.getElementById('totp_qr_area').style.display = 'block';
}

async function verifyTOTP() {
    const code = document.getElementById('totp_verify_code').value.trim();
    if (!code) return;
    const res = await api('/user/totp/verify', { method:'POST', body:JSON.stringify({code}) });
    if (res&&res.ok) {
        document.getElementById('totp_qr_area').style.display='none';
        document.getElementById('totp_enabled_area').style.display='block';
        showToast('2FA enabled successfully');
    } else { showToast('Invalid code', false); }
}

async function disableTOTP() {
    const password = document.getElementById('totp_disable_pass').value;
    const res = await api('/user/totp', { method:'DELETE', body:JSON.stringify({password}) });
    if (res&&res.ok) {
        document.getElementById('totp_enabled_area').style.display='none';
        document.getElementById('totp_setup_area').style.display='block';
        showToast('2FA disabled');
    } else { showToast('Failed – check your password', false); }
}

async function checkTOTPStatus() {
    const res = await api('/user/info');
    if (!res||!res.ok) return;
    const u = await res.json();
    if (u.totp_enabled) {
        document.getElementById('totp_setup_area').style.display='none';
        document.getElementById('totp_enabled_area').style.display='block';
    }
}

function logout() { localStorage.clear(); window.location.href = BASE_PATH + '/'; }

applyLang();
checkTOTPStatus();

function toggleSidebar() { const sb = document.querySelector('.sidebar'); const mo = document.getElementById('mobileOverlay'); if(sb){ sb.classList.toggle('open'); } if(mo){ mo.classList.toggle('open'); } }
</script>
</body>
</html>
